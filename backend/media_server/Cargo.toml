[package]
name = "vault_microservice"
version = "0.1.0"
edition = "2021"
authors = ["SIH Team"]
description = "Ultra-lightweight high-performance media storage microservice"

[dependencies]
# Web Framework & Async Runtime
axum = { version = "=0.7.9", features = ["multipart"] }
tokio = { version = "=1.53.2", features = ["full"] }
tokio-util = { version = "=0.7.19", features = ["io"] }
tower-http = { version = "=0.5.2", features = ["cors", "trace"] }

# Data Serialization & Storage
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
bincode = "=1.3.3"

uuid = { version = "1.8", features = ["v4"] }

# Embedded Database Layer (SQLite WAL)
sqlx = { version = "=0.7.4", features = ["sqlite", "runtime-tokio-native-tls"] }

# Utility & Logging
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
futures-util = "=0.3.34"
thiserror = "=1.0.69"
chrono = { version = "=0.4.45", features = ["serde"] }

# Development & Testing
tower = { version = "0.4", features = ["util"] }

# Production Optimization Settings
[profile.release]
opt-level = 3     # Maximum Speed Optimization
lto = true        # Link-Time Optimization (Reduces Binary Size)
codegen-units = 1 # Maximizes LTO efficiency
panic = "abort"   # Disables unwinding stack to reduce binary size & overhead
strip = true      # Strips symbols from the binary
