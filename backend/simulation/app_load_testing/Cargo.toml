[package]
name = "load_testing"
version = "0.1.0"
edition = "2021"

[dependencies]
dotenvy = "0.15"

# Asynchronous runtime for high concurrency
tokio = { version = "1.38", features = ["full"] }

# Fast HTTP Client for making API calls
reqwest = { version = "0.11", features = ["json"] }

# Framework for JSON serialization and deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
