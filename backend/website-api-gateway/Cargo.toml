[package]
name = "website-api-gateway"
version = "0.1.0"
edition = "2021"
authors = ["Arvind Sharma <coopgrid@gmail.com>"]
description = "A high-performance, cookie-based authenticated API Gateway for the website built with Rust and Axum"
readme = "README.md"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
jsonwebtoken = "9.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors", "trace"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }